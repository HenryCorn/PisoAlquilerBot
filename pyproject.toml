[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pisorentbot"
version = "0.1.0"
description = "London rental scraper and Telegram notifier"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
  "lxml>=5,<7",
  "Pillow>=10,<12",
  "playwright>=1.48,<2",
  "python-dotenv>=1,<2",
  "python-telegram-bot>=21,<23",
  "pytesseract>=0.3,<1",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
  "types-PyYAML>=6,<7",
]

[project.scripts]
pisorent = "pisorentbot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pisorentbot"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
ignore_missing_imports = true
